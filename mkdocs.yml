  - Configuration Reference:
      - Überblick: configuration-reference/index.md
  - Data Model Reference:
      - Überblick: data-model-reference/index.md
  - Developer Guide:
      - Überblick: developer-guide/index.md
  - Community: https://discord.gg/exTu3Dy2UW
  - Project Governance:
      - AI-Assisted Development: project/AI_ASSISTED_DEVELOPMENT.md
      - Implementation Strategy and UI Quality Gates: project/IMPLEMENTATION_STRATEGY_AND_UI_QUALITY_GATES.md
      - Canonical UI Interaction Model: ui/CANONICAL_UI_INTERACTION_MODEL.md
      - Canonical UI Completion Record: ui/CANONICAL_UI_INTERACTION_MODEL_COMPLETION_RECORD.md
      - Repository Test Isolation: project/TEST_ISOLATION.md
