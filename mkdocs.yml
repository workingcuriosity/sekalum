      - ADR-021 Generic CredentialMethod Model: adr/ADR-021-Generic-Credential-Method-Model.md
  - Anhang:
      - Überblick: appendix/index.md

theme:
  name: material
  language: de
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dunkles Farbschema aktivieren
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Helles Farbschema aktivieren

plugins:
  - search:
      lang: de
  - mermaid2
  - with-pdf:
      author: cyphre-san productions
      cover_title: Sekalum Documentation
      cover_subtitle: Release 1.0
      output_path: pdf/credential-hub-documentation.pdf
      enabled_if_env: ENABLE_PDF_EXPORT

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  version:
    provider: mike
    default: latest
  social: []
  # Release 1.0 provides an English Quick Start. Further translations are published as reviewed content becomes available.

extra_css:
  - assets/stylesheets/credential-hub.css
