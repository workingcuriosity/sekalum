      - Gesamtarchitektur: architecture/Gesamtarchitektur.md
      - Schichtenmodell: architecture/Schichtenmodell.md
      - C4 Architecture: architecture/C4_ARCHITECTURE.md
      - Architecture Knowledge Map: architecture/ARCHITECTURE_KNOWLEDGE_MAP.md
