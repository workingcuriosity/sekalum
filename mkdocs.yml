site_name: Sekalum Documentation
site_description: Open Source Release 1.0 documentation for Sekalum
site_author: Working Curiosity

docs_dir: docs
site_dir: site

repo_name: workingcuriosity/sekalum
repo_url: https://github.com/workingcuriosity/sekalum
edit_uri: ""


nav:
  - Handbook: index.md
  - Quick Start: quick-start-guide/index.md
  - Installation Guide: installation-guide/index.md
  - User Guide: user-guide/index.md
  - Operations Guide: operations-guide/index.md
  - Security Guide: security-guide/index.md
  - Developer Guide: developer-guide/index.md
  - API Notes:
      - REST API: api/REST_API.md
      - OAuth: api/OAuth_API.md
      - Health: api/Health_API.md
  - Provider Documentation: providers/README.md
  - Release Guide:
      - Guide: release-guide/index.md
      - Changelog: changelog/README.md
  - Community: https://discord.gg/exTu3Dy2UW

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Enable dark mode
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Enable light mode

plugins:
  - search:
      lang: en
  - mermaid2
  - with-pdf:
      author: Working Curiosity
      cover_title: Sekalum Documentation
      cover_subtitle: Release 1.0
      output_path: pdf/sekalum-documentation.pdf
      enabled_if_env: ENABLE_PDF_EXPORT

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  version:
    provider: mike
    default: latest
  social: []
  # Release 1.0 provides an English Quick Start. Further translations are published as reviewed content becomes available.

extra_css:
  - assets/stylesheets/sekalum.css
