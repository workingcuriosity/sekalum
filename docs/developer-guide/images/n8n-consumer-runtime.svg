<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1050" viewBox="0 0 1100 1050" role="img" aria-labelledby="title desc">
  <title id="title">n8n as a generic Consumer Runtime</title>
  <desc id="desc">An n8n workflow uses an HTTP Request node to call the generic Sekalum Consumer API for Discovery and Resolve before calling a Target API.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <style>.box{stroke-width:3;rx:18}.label{font:700 29px system-ui,sans-serif;fill:#172033}.small{font:22px system-ui,sans-serif;fill:#334155}.title{font:700 38px system-ui,sans-serif;fill:#111827}.arrow{stroke:#334155;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="1050" fill="#f8fafc"/>
  <text x="550" y="62" text-anchor="middle" class="title">n8n as a Consumer Runtime</text>
  <text x="550" y="100" text-anchor="middle" class="small">Same generic API, grants and security rules as every other Consumer</text>
  <rect x="140" y="145" width="820" height="112" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="550" y="192" text-anchor="middle" class="label">n8n Workflow</text><text x="550" y="229" text-anchor="middle" class="small">Automation / workflow runtime</text>
  <line x1="550" y1="257" x2="550" y2="310" class="arrow"/>
  <rect x="140" y="318" width="820" height="112" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="550" y="365" text-anchor="middle" class="label">HTTP Request Node</text><text x="550" y="402" text-anchor="middle" class="small">Bearer Consumer token</text>
  <line x1="550" y1="430" x2="550" y2="483" class="arrow"/>
  <rect x="140" y="491" width="820" height="112" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="550" y="538" text-anchor="middle" class="label">Sekalum Consumer API</text><text x="550" y="575" text-anchor="middle" class="small">Grant-based authorization boundary</text>
  <line x1="550" y1="603" x2="550" y2="648" class="arrow"/>
  <rect x="140" y="656" width="390" height="112" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="335" y="703" text-anchor="middle" class="label">Discovery</text><text x="335" y="740" text-anchor="middle" class="small">Select public credentialKey</text>
  <rect x="570" y="656" width="390" height="112" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="765" y="703" text-anchor="middle" class="label">Resolve</text><text x="765" y="740" text-anchor="middle" class="small">Request allowed fields</text>
  <line x1="530" y1="712" x2="560" y2="712" class="arrow"/>
  <line x1="765" y1="768" x2="765" y2="821" class="arrow"/>
  <rect x="140" y="829" width="820" height="112" class="box" fill="#f1f5f9" stroke="#475569"/>
  <text x="550" y="876" text-anchor="middle" class="label">Target API</text><text x="550" y="913" text-anchor="middle" class="small">Use result, then discard resolved values</text>
  <text x="550" y="1002" text-anchor="middle" class="small">n8n has no privileged path and does not bypass Management API or Grants.</text>
</svg>
