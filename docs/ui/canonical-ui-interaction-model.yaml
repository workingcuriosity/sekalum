  - id: UI-CREDENTIAL-DETAIL
    type: modal
    title: Credential detail view
    status: ACTIVE
    route: /admin/credentials.html
    parent: UI-ADMIN-CREDENTIALS
    roles:
      - administrator
    permissions:
      - credentials:read
