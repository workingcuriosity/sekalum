      - credential selected or detail identifier requested
    visible_when:
      - detail panel is open
    data_dependencies:
      - credential identifier
      - provider
      - public metadata
      - status
    source_files:
      - public/admin/credentials.html
      - public/admin/credentials.js
    canonical_references:
      - docs/user-guide/index.md
    test_references: []
    live_verified: false
    handler: openDetail
    backend: /api/v1/credentials/:credentialId
    selectors:
      - strategy: test_id
        value: credential-detail
        scope: credentials-page
        source_file: public/admin/credentials.html
        required: true
        runtime_generated: false
        exclusive: true
  - id: UI-CREDENTIAL-EDIT
    type: modal
    title: Edit credential dialog
