    backend: /api/v1/credentials/test-connection
  - id: UI-WIZARD-STEP-OAUTH
    type: wizard_step
    title: OAuth authorization
    status: ACTIVE
    route: /admin/
    parent: UI-ADMIN-WIZARD
    roles:
      - administrator
    permissions:
      - credentials:manage
      - providers:manage
    entry_conditions:
      - provider supports OAuth
    visible_when:
      - OAuth method selected
    data_dependencies:
      - OAuth authorization URL
      - callback state
    source_files:
      - public/admin/index.html
      - public/admin/wizard.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/oauth-http-login.test.js
      - tests/integration/oauth-callback-public-language.test.js
    live_verified: false
    handler: startOAuth
    backend: /api/v1/providers/:providerKey/oauth/start
  - id: UI-WIZARD-STEP-SUMMARY
    type: wizard_step
    title: Review and create credential
    status: ACTIVE
    route: /admin/
    parent: UI-ADMIN-WIZARD
    roles:
      - administrator
    permissions:
      - credentials:manage
    entry_conditions:
      - credential data valid
    visible_when:
      - wizard step is 5
    data_dependencies:
      - credential payload
      - grant configuration
    source_files:
      - public/admin/index.html
      - public/admin/wizard.js
    canonical_references:
      - docs/user-guide/index.md
    test_references: []
    live_verified: false
    handler: createCredential
    backend: /api/v1/credentials
    selectors:
      - strategy: test_id
        value: credential-wizard-create
        scope: wizard-summary
        source_file: public/admin/index.html
        required: true
        runtime_generated: false
        exclusive: true
  - id: UI-PROVIDER-DETAILS
    type: form
    title: Provider details form
    status: ACTIVE
    route: /admin/providers.html
    parent: UI-ADMIN-PROVIDERS
    roles:
      - administrator
    permissions:
      - providers:manage
    entry_conditions:
