interactions:
  - id: INT-TOKEN-LIST-OPEN
    source: UI-ADMIN-TOKENS
    trigger: open API token management
    control: UI-ADMIN-TOKENS
    preconditions:
      - authenticated admin
    action: GET API token list
    success:
      - token list rendered
    failure:
      - token list error rendered
    next_state: UI-TOKENS-TABLE
    side_effects: []
    messages:
      - FB-LOADING
      - FB-SYSTEM-ERROR
    security_boundary: api-tokens:read authorization
    capability_ids:
      - CAP-TOKEN-READ
    source_files:
      - public/admin/api-tokens.js
      - tests/ui/fixture-server.mjs
    test_ids: []
    outcome: load_data
    handler: loadApiTokens
    redirect: /admin/api-tokens.html
  - id: INT-TOKEN-CREATE-FIXTURE
    source: UI-TOKEN-CREATE
    trigger: submit token form
    control: UI-TOKEN-CREATE
    preconditions:
      - empty token list
      - valid token form
    action: POST synthetic API token
    success:
      - redacted token display shown
      - token list refreshed
    failure:
      - creation error rendered
    next_state: UI-TOKENS-TABLE
    side_effects:
      - synthetic token persisted in fixture namespace
    messages:
      - FB-SUCCESS
      - FB-VALIDATION
      - FB-SYSTEM-ERROR
    security_boundary: api-tokens:manage authorization and fixture namespace
    capability_ids:
      - CAP-TOKEN-CREATE
    source_files:
      - public/admin/api-tokens.js
      - tests/ui/fixture-server.mjs
    test_ids: []
    outcome: create_token
    handler: submitCreateTokenForm
    redirect: null
  - id: INT-TOKEN-DETAIL-NOT-FOUND
    source: UI-TOKENS-TABLE
    trigger: request missing token detail
    control: UI-TOKENS-TABLE
    preconditions:
      - authenticated admin
      - unknown token identifier
    action: GET missing API token
    success:
      - not-found error rendered
    failure:
      - unexpected token detail rendered
    next_state: UI-TOKENS-TABLE
    side_effects: []
    messages:
      - FB-SYSTEM-ERROR
    security_boundary: api-tokens:read authorization
    capability_ids:
      - CAP-TOKEN-READ
    source_files:
      - public/admin/api-tokens.js
      - tests/ui/fixture-server.mjs
    test_ids: []
    outcome: error_feedback
    handler: fetchTokenDetail
    redirect: null
  - id: INT-WIZARD-NEXT
    source: UI-WIZARD-STEP-TYPE
    trigger: click Next
    control: UI-WIZARD-NEXT
    preconditions:
      - selected type
    action: advance wizard
    success:
      - provider step rendered
    failure:
      - validation error displayed
    next_state: UI-WIZARD-STEP-PROVIDER
    side_effects:
      - wizard state updated
    messages:
      - FB-VALIDATION
    security_boundary: admin session
    capability_ids:
      - CAP-PROVIDER-DISCOVERY
    source_files:
      - public/admin/wizard.js
    test_ids:
      - tests/integration/credential-creation-flow.test.js
    outcome: navigate
    handler: goNext
    redirect: null
  - id: INT-WIZARD-CREATE
    source: UI-WIZARD-STEP-SUMMARY
    trigger: click create credential
    control: UI-WIZARD-STEP-SUMMARY
    preconditions:
      - credential payload valid
    action: POST credential
    success:
      - credential created
      - result shown
    failure:
      - validation error shown and no credential created
    next_state: UI-WIZARD-STEP-SUMMARY
    side_effects:
      - synthetic credential persisted in fixture namespace
    messages:
      - FB-SUCCESS
      - FB-VALIDATION
      - FB-SYSTEM-ERROR
    security_boundary: credentials:manage authorization and fixture namespace
    capability_ids:
      - CAP-CREDENTIAL-CREATE
    source_files:
      - public/admin/wizard.js
      - tests/ui/fixture-server.mjs
    test_ids: []
    outcome: save_data
    handler: createCredential
    redirect: null
  - id: INT-WIZARD-OAUTH
    source: UI-WIZARD-STEP-OAUTH
    trigger: click OAuth start
    control: UI-WIZARD-STEP-OAUTH
    preconditions:
      - OAuth provider selected
    action: request authorization URL and open provider handoff
    success:
      - provider authorization page opened
    failure:
      - error shown
    next_state: UI-WIZARD-STEP-OAUTH
    side_effects:
      - popup opened
    messages:
      - FB-SYSTEM-ERROR
    security_boundary: OAuth state and provider boundary
