schema_version: 0.2.1
model:
  id: CUI-IM
  title: Canonical UI Interaction Model
  version: 0.2.1
  status: ACTIVE
source_of_truth:
  format: YAML
  path: docs/ui/canonical-ui-interaction-model.yaml
  schema: docs/ui/canonical-ui-interaction-model.schema.json
  normative: true
  generated_views:
    - docs/ui/generated/ui-tree.md
    - docs/ui/generated/ui-flow.mmd
ownership:
  owner: Sekalum
  maintainer: Working Curiosity
  architecture_review: Architecture Governance
  documentation_maintainer: Documentation Engineer
  validation_owner: Test Engineer
  security_review: Security Engineer
scope:
  includes:
    - UI structure
    - navigation
    - interaction behaviour
    - visibility and role dependencies
    - UI feedback
    - UI traceability
  excludes:
    - architecture decisions
    - API specifications
    - data model
    - security model
    - product requirements
    - release decisions
traceability:
  required_fields:
    - source_files
    - canonical_references
    - test_references
    - live_evidence
  direction:
    - UI
    - capability
    - code
    - API/service
    - canonical requirement
    - test
    - live evidence
change_control:
  review_triggers:
    - new_page
    - new_route
    - new_panel
    - new_dialog
    - new_modal
    - new_wizard
    - new_form_control
    - new_message
    - new_role_dependency
    - new_capability_exposure
    - changed_navigation
    - changed_error_or_recovery_path
  definition_of_done:
    - source_updated
    - schema_validated
    - generated_views_regenerated
    - traceability_updated
    - relevant_tests_updated
    - generator_drift_check_passed
route_matrix:
  - route: /admin/
    node_id: UI-ADMIN-WIZARD
    role: administrator
    authentication: management bearer token
    navigation_entry: Admin navigation → Credential Wizard
    terminal: false
  - route: /admin/dashboard.html
    node_id: UI-ADMIN-DASHBOARD
    role: administrator
    authentication: management bearer token
    navigation_entry: Admin navigation → Dashboard
    terminal: false
  - route: /admin/providers.html
    node_id: UI-ADMIN-PROVIDERS
    role: administrator
    authentication: management bearer token
    navigation_entry: Admin navigation → Providers
    terminal: false
  - route: /admin/credentials.html
    node_id: UI-ADMIN-CREDENTIALS
    role: administrator
    authentication: management bearer token
    navigation_entry: Admin navigation → Credentials
    terminal: false
  - route: /admin/consumer-grants.html
    node_id: UI-ADMIN-GRANTS
    role: administrator
    authentication: management bearer token
    navigation_entry: Admin navigation → Consumer Grants
    terminal: false
  - route: /admin/api-tokens.html
    node_id: UI-ADMIN-TOKENS
    role: administrator
    authentication: management bearer token
    navigation_entry: Admin navigation → API Tokens
    terminal: false
  - route: /admin/credential-transfer.html
    node_id: UI-ADMIN-TRANSFER
    role: administrator
    authentication: management bearer token
    navigation_entry: Admin navigation → Credential Transfer
    terminal: false
  - route: /consumer/
    node_id: UI-CONSUMER
    role: consumer
    authentication: consumer bearer token
    navigation_entry: Wizard handoff or direct route
    terminal: false
api_only_paths:
  - route: /api/v1/management/users
    capability_id: CAP-MANAGEMENT-INTERNAL
    owner: management boundary
    reason: no current UI surface; API-only by intentional 1.x scope
  - route: /api/v1/management/roles
    capability_id: CAP-MANAGEMENT-INTERNAL
    owner: management boundary
    reason: no current UI surface; API-only by intentional 1.x scope
  - route: /api/v1/management/audit-log
    capability_id: CAP-MANAGEMENT-INTERNAL
    owner: management boundary
    reason: no current UI surface; API-only by intentional 1.x scope
  - route: /api/v1/management/metrics
    capability_id: CAP-MANAGEMENT-INTERNAL
    owner: management boundary
    reason: no current UI surface; API-only by intentional 1.x scope
  - route: /api/v1/management/backups
    capability_id: CAP-MANAGEMENT-INTERNAL
    owner: management boundary
    reason: no current UI surface; API-only by intentional 1.x scope
terminal_paths:
  - node_id: UI-ADMIN-FOOTER
    condition: external support, legal or security link selected
    result: external or document destination; no in-app successor
  - node_id: UI-CONSUMER-STATUS
    condition: discovery or resolve completes with success or failure
    result: terminal feedback for the current request; recovery remains available
      where implemented
  - node_id: UI-WIZARD-STEP-OAUTH
    condition: OAuth provider authorization handoff starts
    result: external provider page; callback returns through the documented OAuth
      boundary
taxonomy:
  node_types:
    - application
    - area
    - page
    - section
    - panel
    - wizard
    - wizard_step
    - form
    - field
    - button
    - link
    - menu
    - tab
    - modal
    - drawer
    - table
    - row_action
    - notification
    - empty_state
    - loading_state
    - error_state
    - confirmation
    - redirect
    - external_handoff
  interaction_outcomes:
    - open_modal
    - close_modal
    - navigate
    - refresh
    - load_data
    - save_data
    - validate_input
    - start_oauth
    - open_external_page
    - create_token
    - create_grant
    - revoke_or_delete
    - copy_value
    - show_or_hide
    - show_loading
    - show_success
    - show_warning
    - show_error
    - block_continuation
    - require_confirmation
    - redirect
    - change_authentication_state
  node_statuses:
    - FOUNDATION
    - ACTIVE
    - DEPRECATED
    - UNKNOWN_REQUIRES_REVIEW
  feedback_types:
    - SUCCESS
    - INFO
    - WARNING
    - VALIDATION_ERROR
    - AUTHENTICATION_ERROR
    - AUTHORIZATION_ERROR
    - NETWORK_ERROR
    - SYSTEM_ERROR
    - EMPTY_STATE
    - LOADING
  selector_strategies:
    - test_id
    - id
    - role_and_name
    - name
    - label
    - route
    - structural_fallback
    - not_applicable
nodes:
  - id: UI-APP
    type: application
    title: Sekalum Web UI
    status: ACTIVE
    route: null
    parent: null
    roles:
      - administrator
      - consumer
    permissions: []
    entry_conditions:
      - running HTTP service
    visible_when:
      - application is served
    data_dependencies: []
    source_files:
      - public/admin/admin-shell.js
      - public/consumer/consumer.js
    canonical_references:
      - docs/ui/CANONICAL_UI_INTERACTION_MODEL.md
    test_references:
      - tests/integration/admin-ui.test.js
      - tests/integration/consumer-ui.test.js
    live_verified: true
    handler: null
    backend: null
  - id: UI-ADMIN
    type: area
    title: Admin UI
    status: ACTIVE
    route: /admin/
    parent: UI-APP
    roles:
      - administrator
    permissions:
      - management:read
    entry_conditions:
      - admin authentication succeeds
    visible_when:
      - admin session is authenticated
    data_dependencies:
      - adminApi
    source_files:
      - public/admin/admin-shell.js
      - public/admin/auth.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/admin-auth.test.js
      - tests/integration/admin-ui.test.js
    live_verified: true
    handler: initAdminShell
    backend: src/oauth/oauth-callback-server.js
  - id: UI-CONSUMER
    type: area
    title: Consumer UI
    status: ACTIVE
    route: /consumer/
    parent: UI-APP
    roles:
      - consumer
    permissions:
      - credentials:consume
    entry_conditions:
      - consumer token supplied
    visible_when:
      - consumer page is served
    data_dependencies:
      - consumerApi
    source_files:
      - public/consumer/index.html
      - public/consumer/consumer.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/consumer-ui.test.js
    live_verified: true
    handler: initialize
    backend: src/oauth/oauth-callback-server.js
  - id: UI-ADMIN-WIZARD
    type: page
    title: Credential Wizard
    status: ACTIVE
    route: /admin/
    parent: UI-ADMIN
    roles:
      - administrator
    permissions:
      - credentials:manage
      - providers:read
    entry_conditions:
      - admin authentication succeeds
    visible_when:
      - authenticated admin
    data_dependencies:
      - provider metadata
      - credential metadata
    source_files:
      - public/admin/index.html
      - public/admin/wizard.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/admin-ui.test.js
      - tests/integration/credential-creation-flow.test.js
    live_verified: false
    handler: initializeWizard
    backend: src/oauth/oauth-callback-server.js
  - id: UI-ADMIN-DASHBOARD
    type: page
    title: Dashboard
    status: ACTIVE
    route: /admin/dashboard.html
    parent: UI-ADMIN
    roles:
      - administrator
    permissions:
      - management:read
    entry_conditions:
      - admin authentication succeeds
    visible_when:
      - authenticated admin
    data_dependencies:
      - dashboard data
      - provider data
    source_files:
      - public/admin/dashboard.html
      - public/admin/dashboard.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/admin-ui.test.js
      - tests/integration/dashboard-api.test.js
    live_verified: false
    handler: loadDashboard
    backend: /api/v1/dashboard
  - id: UI-ADMIN-PROVIDERS
    type: page
    title: Custom Provider Wizard
    status: ACTIVE
    route: /admin/providers.html
    parent: UI-ADMIN
    roles:
      - administrator
    permissions:
      - providers:manage
    entry_conditions:
      - admin authentication succeeds
    visible_when:
      - authenticated admin
    data_dependencies:
      - provider definition form state
    source_files:
      - public/admin/providers.html
      - public/admin/providers.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/admin-ui.test.js
      - tests/integration/providers-api.test.js
    live_verified: false
    handler: initProviderWizard
    backend: /api/v1/providers
  - id: UI-ADMIN-CREDENTIALS
    type: page
    title: Credential Management
    status: ACTIVE
    route: /admin/credentials.html
    parent: UI-ADMIN
    roles:
      - administrator
    permissions:
      - credentials:read
      - credentials:manage
    entry_conditions:
      - admin authentication succeeds
    visible_when:
      - authenticated admin
    data_dependencies:
      - credentials
      - providers
    source_files:
      - public/admin/credentials.html
      - public/admin/credentials.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/admin-ui.test.js
      - tests/integration/credentials-list-api.test.js
    live_verified: false
    handler: loadCredentials
    backend: /api/v1/credentials
  - id: UI-ADMIN-GRANTS
    type: page
    title: Consumer Grants
    status: ACTIVE
    route: /admin/consumer-grants.html
    parent: UI-ADMIN
    roles:
      - administrator
    permissions:
      - consumer-grants:manage
    entry_conditions:
      - admin authentication succeeds
    visible_when:
      - authenticated admin
    data_dependencies:
      - consumer grants
      - credentials
      - tokens
    source_files:
      - public/admin/consumer-grants.html
      - public/admin/consumer-grants.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/admin-ui.test.js
      - tests/unit/consumer-grant-service.test.js
    live_verified: false
    handler: loadGrants
    backend: /api/v1/management/consumer-grants
  - id: UI-ADMIN-TOKENS
    type: page
    title: API Tokens
    status: ACTIVE
    route: /admin/api-tokens.html
    parent: UI-ADMIN
    roles:
      - administrator
    permissions:
      - api-tokens:read
      - api-tokens:manage
    entry_conditions:
      - admin authentication succeeds
    visible_when:
      - authenticated admin
    data_dependencies:
      - api token metadata
    source_files:
      - public/admin/api-tokens.html
      - public/admin/api-tokens.js
    canonical_references:
      - docs/security-guide/index.md
    test_references: []
    live_verified: false
    handler: loadApiTokens
    backend: /api/v1/management/api-tokens
    selectors:
      - strategy: test_id
        value: api-token-refresh
        scope: api-token-page
        source_file: public/admin/api-tokens.html
        required: true
        runtime_generated: false
        exclusive: true
  - id: UI-ADMIN-TRANSFER
    type: page
    title: Credential Transfer
    status: ACTIVE
    route: /admin/credential-transfer.html
    parent: UI-ADMIN
    roles:
      - administrator
    permissions:
      - credentials:manage
    entry_conditions:
      - admin authentication succeeds
    visible_when:
      - authenticated admin
    data_dependencies:
      - credential list
      - import/export state
    source_files:
      - public/admin/credential-transfer.html
      - public/admin/credential-transfer.js
    canonical_references:
      - docs/security-guide/index.md
    test_references:
      - tests/integration/credential-transfer-api.test.js
      - tests/integration/admin-ui.test.js
    live_verified: false
    handler: loadCredentials
    backend: /api/v1/credentials/export and /api/v1/credentials/import
  - id: UI-CONSUMER-DISCOVERY
    type: panel
    title: Consumer credential discovery
    status: ACTIVE
    route: /consumer/
    parent: UI-CONSUMER
    roles:
      - consumer
    permissions:
      - credentials:consume
    entry_conditions:
      - consumer token accepted
    visible_when:
      - discovery request succeeds
    data_dependencies:
      - available credentials
    source_files:
      - public/consumer/index.html
      - public/consumer/consumer.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/consumer-ui.test.js
    live_verified: false
    handler: loadCredentials
    backend: /api/v1/consumer/credentials
  - id: UI-CONSUMER-RESOLVE
    type: panel
    title: Consumer secret resolution
    status: ACTIVE
    route: /consumer/
    parent: UI-CONSUMER
    roles:
      - consumer
    permissions:
      - credentials:consume
    entry_conditions:
      - credential selected and fields selected
    visible_when:
      - resolve request completes
    data_dependencies:
      - selected credential
      - selected secret names
    source_files:
      - public/consumer/index.html
      - public/consumer/consumer.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/consumer-ui.test.js
    live_verified: false
    handler: resolveCredential
    backend: /api/v1/consumer/credentials/:credentialKey/resolve
    selectors:
      - strategy: test_id
        value: consumer-resolve-submit
        scope: consumer-secret-selection
        source_file: public/consumer/consumer.js
        required: true
        runtime_generated: true
        exclusive: true
  - id: UI-CONSUMER-HANDOFF
    type: link
    title: Open Consumer interface
    status: ACTIVE
    route: /admin/
    parent: UI-ADMIN-WIZARD
    roles:
      - administrator
    permissions:
      - credentials:consume
    entry_conditions:
      - credential and consumer grant verified
    visible_when:
      - consumer integration complete
    data_dependencies:
      - consumer handoff destination
    source_files:
      - public/admin/wizard.js
    canonical_references:
      - docs/quick-start-guide/index.md
    test_references: []
    live_verified: false
    handler: renderConsumerGrantPanel
    backend: null
    test_required: true
    selectors:
      - strategy: test_id
        value: consumer-handoff-open
        scope: consumer-grant-panel
        source_file: public/admin/wizard.js
        required: true
        runtime_generated: true
        exclusive: true
  - id: UI-WIZARD-STEP-TYPE
    type: wizard_step
    title: Select credential type
    status: ACTIVE
    route: /admin/
    parent: UI-ADMIN-WIZARD
    roles:
      - administrator
    permissions:
      - credentials:manage
    entry_conditions:
      - wizard loaded
    visible_when:
      - wizard step is 1
    data_dependencies:
      - provider types
    source_files:
      - public/admin/index.html
      - public/admin/wizard.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/credential-creation-flow.test.js
    live_verified: false
    handler: renderTypeSelection
    backend: /api/v1/providers
  - id: UI-WIZARD-STEP-PROVIDER
    type: wizard_step
    title: Select provider
    status: ACTIVE
    route: /admin/
    parent: UI-ADMIN-WIZARD
    roles:
      - administrator
    permissions:
      - providers:read
    entry_conditions:
      - credential type selected
    visible_when:
      - wizard step is 2
    data_dependencies:
      - provider list
      - provider search
    source_files:
      - public/admin/index.html
      - public/admin/wizard.js
    canonical_references:
      - docs/user-guide/index.md
    test_references:
      - tests/integration/credential-creation-flow.test.js
    live_verified: false
    handler: renderProviders
    backend: /api/v1/providers
  - id: UI-WIZARD-STEP-FORM
    type: wizard_step
    title: Enter credential data
    status: ACTIVE
    route: /admin/
    parent: UI-ADMIN-WIZARD
    roles:
