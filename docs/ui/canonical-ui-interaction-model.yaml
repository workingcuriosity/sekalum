audit:
  scope: Repository UI, UI handlers, UI-reachable backend routes, tests, canonical
    documentation and read-only live route smoke checks; dynamic repeated
    controls are represented by their rendering containers and handlers.
  repository_head: PUBLIC_STAGING_PROJECTION
  counts:
    areas: 2
    pages: 8
    panels: 7
    tabs: 0
    dialogs: 4
    modals: 5
    forms: 7
    buttons: 29
    links: 12
    tables: 4
    messages: 7
    interactions: 58
  findings:
    - id: FIND-UI-001
      category: UI Coverage
      status: OBSERVED
      evidence:
        - public/admin/*.html and public/consumer/index.html inspected; 8 page
          nodes represented
      recommendation: Continue expanding control-level nodes for dynamic table row
        actions and generated wizard fields in Phase 3 if individual
        selector-level coverage is required.
    - id: FIND-TRACE-001
      category: Missing Traceability
      status: OPEN
      evidence:
        - live_verified is false for page-level interactions because only route
          smoke checks were performed
      recommendation: Capture authenticated browser evidence before claiming
        interaction-level live coverage.
    - id: FIND-DOC-001
      category: Documentation Drift
      status: RESOLVED
      evidence:
        - UI handlers and API routes are implemented across public/admin and
          src/oauth; canonical UI source and generated views are synchronized
      recommendation: Keep the populated model synchronized when UI or route contracts change.
    - id: FIND-API-001
      category: Orphan Capability
      status: ACCEPTED
      evidence:
        - management routes for users
        - roles
        - audit-log
        - metrics and backups have no current UI node and are listed in
          api_only_paths
      recommendation: Preserve intentional API-only ownership; do not expose automatically.
    - id: FIND-SEC-001
      category: Security Observation
      status: OBSERVED
      evidence:
        - token values are shown only after creation; credential pages state
          secret values are not displayed; consumer resolution is grant-bound
      recommendation: Preserve current secret-handling boundaries and include them in
        future authenticated live evidence.
    - id: FIND-PUBLIC-001
      category: Publication Boundary
      severity: INFO
      status: DOCUMENTED
      observed_behavior: Authenticated live evidence is maintained outside the public repository.
      expected_behavior: The public tree contains only reproducible, redacted
        validation artifacts.
      evidence:
        - docs/ui/CANONICAL_UI_INTERACTION_MODEL.md
      recommendation: Keep authenticated live evidence in the controlled validation
        environment.
  non_exposed_capabilities:
    - capability_id: CAP-MANAGEMENT-INTERNAL
      classification: API_ONLY_INTENTIONAL
      reason: Management API surfaces are implemented and tested but no current UI
        controls invoke them; no defect is inferred.
  phase_3_recommendations:
    - Add selector-level nodes for repeated table row actions and generated
      provider/credential fields if required by the next coverage threshold.
    - Run authenticated browser evidence for each primary interaction and record
      durable evidence references.
    - Review API-only capabilities with the responsible owner before any UI
      exposure decision.
    - Add automated model coverage checks that compare discovered route/selector
      inventories with the YAML source.
