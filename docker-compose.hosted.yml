services:
  credential-hub:
    build:
      context: .
    ports: !reset []
    expose:
      - "3000"
    environment:
      HOSTED_MODE: "true"
      NODE_ENV: "production"
      APP_BIND_HOST: "0.0.0.0"
      TRUSTED_PROXY: "172.30.0.2"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public HTTPS origin}"
    networks:
      proxy_net:
        ipv4_address: 172.30.0.3
        aliases:
          - app

  tls-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      - credential-hub
    environment:
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public HTTPS origin}"
    ports:
      - "${HOSTED_HTTP_PORT:-80}:80"
      - "${HOSTED_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/hosted.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./deploy/tls}:/etc/nginx/tls:ro
    networks:
      proxy_net:
        ipv4_address: 172.30.0.2

networks:
  proxy_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
